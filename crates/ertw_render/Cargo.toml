[package]
name = "ertw_render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native non-participant observer application for ERTW"
repository.workspace = true
homepage.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
bevy = { workspace = true, default-features = false, features = [
    "std",
    "bevy_log",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_window",
    "bevy_winit",
    "x11",
    "multi_threaded",
] }

ertw_core = { workspace = true }
ertw_interface = { workspace = true }
avian2d = { workspace = true, optional = true }
random_policy = { path = "../../agents/random_policy", optional = true }
bevy_egui = { version = "0.41.0", default-features = false, features = ["default_fonts", "render"], optional = true }

[features]
default = []
render = ["dep:avian2d", "dep:random_policy", "dep:bevy_egui"]

[[bin]]
name = "ertw"
path = "src/bin/ertw.rs"
required-features = ["render"]
