description = "Deterministic zero-reward physics substrate for ERTW"
repository.workspace = true
homepage.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
bevy = { workspace = true, default-features = false, features = [
    "std",
    "bevy_log",
    "reflect_auto_register",
    "multi_threaded",
    "debug",
] }
avian2d = { workspace = true }
noise = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
ertw_interface = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }

[dev-dependencies]
random_policy = { path = "../../agents/random_policy" }
proptest = { workspace = true }

[features]
default = []

[[bench]]
name = "simulation"
harness = false
